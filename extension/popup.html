<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; margin: 14px; width: 280px; background: #0b0e14; color: #eee; }
    h1 { font-size: 14px; margin: 0 0 8px; letter-spacing: 1px; }
    p { font-size: 12px; color: #9aa; line-height: 1.45; margin: 0 0 10px; }
    .note { font-size: 12px; color: #c4b5fd; line-height: 1.45; margin: 0 0 10px; padding: 8px 10px; background: #161b26; border-radius: 8px; border: 1px solid #2a3142; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #666; }
    .dot.on { background: #34d399; box-shadow: 0 0 6px #34d399; }
    .dot.off { background: #f87171; }
    code { font-size: 11px; color: #c4b5fd; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 9px; background: #7c5cfc; color: white; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>BASIRA</h1>
  <p><span class="dot" id="dot"></span><span id="status">checking…</span></p>
  <button id="start">Start Classroom Bridge</button>
  <p class="note">Keep Basira tab focused — feed shows here in the app. Classroom & Docs open in the background; live screenshots stream into Basira.</p>
  <p>When Basira says “connect classroom”, this extension scrapes your signed-in Classroom tabs without stealing focus for long.</p>
  <p>Bridge: <code>127.0.0.1:8790</code></p>
  <script src="popup.js"></script>
</body>
</html>
