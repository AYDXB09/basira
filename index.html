<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basira — Voice Tutor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- top chrome: wordmark + live status -->
  <header id="top">
    <div id="brand">basira</div>
    <div id="status">
      <span id="micdot"></span>
      <span id="statusText">waking up…</span>
    </div>
  </header>

  <!-- center: the orb + conversation line -->
  <main id="stage">
    <div id="orb" aria-label="Voice tutor">
      <div class="halo"></div>
      <div class="shell"></div>
      <div class="inner">
        <div class="scatter"></div>
        <div class="cluster">
          <div class="ball ball-blue"></div>
          <div class="ball ball-purple"></div>
          <div class="ball ball-cyan"></div>
          <div class="ball ball-amber"></div>
        </div>
      </div>
      <div class="rim"></div>
    </div>

    <div id="convo" aria-live="polite">
      <div id="line-user"></div>
      <div id="line-tutor"></div>
    </div>
  </main>

  <!-- camera preview (only while camera is on) -->
  <div id="camDock" hidden>
    <video id="camVideo" playsinline muted></video>
    <button id="camClose" aria-label="Close camera">✕</button>
  </div>

  <!-- bottom: the only two buttons -->
  <footer id="bar">
    <div class="baction">
      <button class="bbtn" id="btnCam" aria-label="Camera">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <span>Camera</span>
    </div>
    <div class="baction">
      <button class="bbtn" id="btnUpload" aria-label="Upload files">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <span>Upload</span>
    </div>
  </footer>

  <!-- KEY GATE: shown only when no OpenRouter key is saved -->
  <div id="keygate" hidden>
    <div class="kg-card">
      <h2>One-time setup</h2>
      <p>Paste your OpenRouter API key. It is stored only in this browser.</p>
      <input id="kgInput" type="password" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false">
      <button id="kgSave">Save & start</button>
      <p class="kg-hint">Get a key at openrouter.ai/keys</p>
    </div>
  </div>

  <input type="file" id="fileInput" multiple
         accept="video/*,image/*,.txt,.md,.srt,.vtt,.pdf,text/plain" hidden>

<script src="js/config.js?v=4"></script>
<script src="js/config.local.js" onerror="this.remove()"></script>
<script src="js/earcons.js?v=4"></script>
<script src="js/orb.js?v=4"></script>
<script src="js/llm.js?v=4"></script>
<script src="js/pedagogy.js?v=4"></script>
<script src="js/tts.js?v=4"></script>
<script src="js/stt.js?v=4"></script>
<script src="js/ingest.js?v=4"></script>
<script src="js/content.js?v=4"></script>
<script src="js/assistant.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
