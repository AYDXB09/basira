<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basira — Voice Tutor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>

  <header id="top">
    <div id="brand">basira</div>
    <div id="status">
      <span id="micdot"></span>
      <span id="statusText">waking up…</span>
    </div>
  </header>

  <main id="stage">
    <div id="orb" aria-label="Voice tutor">
      <div class="halo"></div>
      <div class="shell"></div>
      <div class="inner">
        <div class="scatter"></div>
        <div class="cluster">
          <div class="ball ball-blue"></div>
          <div class="ball ball-purple"></div>
          <div class="ball ball-cyan"></div>
          <div class="ball ball-amber"></div>
        </div>
      </div>
      <div class="rim"></div>
    </div>

    <div id="convo" aria-live="polite">
      <div id="line-user"></div>
      <div id="line-tutor"></div>
    </div>
  </main>

  <div id="camDock" hidden>
    <video id="camVideo" playsinline muted></video>
    <button id="camClose" aria-label="Close camera">✕</button>
  </div>

  <div id="browserPanel" hidden></div>

  <footer id="bar">
    <div class="baction">
      <button class="bbtn" id="btnDemo" aria-label="Demo mode" type="button">
        <span style="font-weight:800;font-size:12px">DEMO</span>
      </button>
      <span>Demo</span>
    </div>
    <div class="baction">
      <button class="bbtn" id="btnPrompt" aria-label="System prompt" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      </button>
      <span>Prompt</span>
    </div>
    <div class="baction">
      <button class="bbtn" id="btnCam" aria-label="Camera">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <span>Camera</span>
    </div>
    <div class="baction">
      <button class="bbtn" id="btnUpload" aria-label="Upload files">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <span>Upload</span>
    </div>
    <div class="baction">
      <button class="bbtn" id="btnData" aria-label="Export session data">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <span>Data</span>
    </div>
    <div class="baction">
      <button class="bbtn" id="btnKey" aria-label="API key">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M12 15h8m-2-3 3 3-3 3"/></svg>
      </button>
      <span>Key</span>
    </div>
  </footer>

  <div id="promptGate" hidden>
    <div class="pg-card" onclick="event.stopPropagation()">
      <h2>System prompt</h2>
      <p>Live template judges see. Edit and Save — applies instantly. Language line still follows speech automatically.</p>
      <textarea id="pgInput" spellcheck="false"></textarea>
      <p id="pgNote" class="pg-note"></p>
      <div class="pg-actions">
        <button id="pgSave" type="button">Save</button>
        <button id="pgReset" type="button" class="pg-secondary">Reset default</button>
        <button id="pgClose" type="button" class="pg-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="keygate" hidden>
    <div class="kg-card" onclick="event.stopPropagation()">
      <h2>Enter OpenRouter API key</h2>
      <p>Paste <b>your own</b> key. Stored only in this browser.</p>
      <input id="kgInput" type="text" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false" inputmode="text">
      <p id="kgErr" class="kg-err" hidden></p>
      <button id="kgSave" type="button">Save & start</button>
      <p class="kg-hint">Key: <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a></p>
      <button id="kgClear" type="button" class="kg-link">Clear saved key</button>
    </div>
  </div>

  <input type="file" id="fileInput" multiple
         accept="video/*,image/*,.txt,.md,.srt,.vtt,.pdf,text/plain" hidden>

<script src="js/config.js?v=14"></script>
<script src="js/config.local.js" onerror="this.remove()"></script>
<script src="js/telemetry.js?v=14"></script>
<script src="js/earcons.js?v=14"></script>
<script src="js/orb.js?v=14"></script>
<script src="js/llm.js?v=14"></script>
<script src="js/pedagogy.js?v=14"></script>
<script src="js/tts.js?v=14"></script>
<script src="js/stt.js?v=14"></script>
<script src="js/ingest.js?v=14"></script>
<script src="js/content.js?v=14"></script>
<script src="js/memory.js?v=14"></script>
<script src="js/demo-pack.js?v=14"></script>
<script src="js/demo-flow.js?v=14"></script>
<script src="js/browser-panel.js?v=14"></script>
<script src="js/assistant.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
